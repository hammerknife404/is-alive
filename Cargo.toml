[package]
name = "is-alive"
version = "0.5.0"
edition = "2024"
description = "Native network testing toolkit: ping, port check, traceroute, subnet sweep, DNS"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
dns-lookup = "4"
socket2 = "0.6"
if-addrs = "0.15"
rfd = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
