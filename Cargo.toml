[package]
name = "is-alive"
version = "0.26.4"
edition = "2024"
description = "Native network testing toolkit: ping, port check, traceroute, speed test with jitter, subnet sweep, DNS, domain/mail health, network map"
license-file = "LICENSE.md"

[dependencies]
base64 = "0.23"
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wgpu_no_default_features", "wayland", "x11"] }
dns-lookup = "4"
socket2 = "0.6"
if-addrs = "0.15"
rfd = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "win-system-proxy"] }
serde_json = { version = "1", features = ["preserve_order"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
aes = "0.8"
cbc = "0.1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
regex = "1"
arboard = { version = "3", default-features = false }
# The map's PNG export: the CPU renderer and font reader egui already uses
# for its text, so no new crates (pure Rust, nothing for the C runtime).
vello_cpu = { version = "0.1", default-features = false, features = ["std", "u8_pipeline"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }

[dev-dependencies]
# Tests check the SVG and draw.io exports parse as XML.
roxmltree = "0.20"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The window's second renderer, for when OpenGL can't start (see src/startup.rs).
wgpu = { version = "30", default-features = false, features = ["vulkan"] }
# The window's icon on Wayland (see src/wayland_icon.rs). eframe already
# builds all four with these features, so no new crates.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# The window's second renderer, for when OpenGL can't start (see src/startup.rs):
# Direct3D 12, with Windows' own software renderer (WARP) where there's no GPU.
wgpu = { version = "30", default-features = false, features = ["dx12"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
