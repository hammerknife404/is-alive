name: weekly

# Things that rot without a code change: the free Speed Test servers the
# presets point at, advisories filed against crates already in the
# lockfile, and the MAC vendor table. Weekly, by hand, and the audit on
# any lockfile change.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [Cargo.lock, Cargo.toml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs (tags are mutable).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.1
      - run: cargo install cargo-audit --locked
      # Fails on a vulnerability; unmaintained crates (zbus's zvariant, from
      # accesskit's AT-SPI on Linux) are listed as warnings.
      - run: cargo audit

  presets:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked -- --ignored presets_answer --nocapture

  # The MAC vendor table built into the app (assets/oui.txt.gz): the IEEE
  # registers new makers every week. Rebuilt here, and when it changed, a
  # pull request carries the new table and its date (assets/oui.date,
  # shown in Settings). Nothing is pushed to main: the PR is merged like
  # any other, and the table reaches users with the next release.
  vendors:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/update-oui.py
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: vendor-table
          add-paths: |
            assets/oui.txt.gz
            assets/oui.date
          commit-message: "MAC vendor table: this week's IEEE registrations"
          title: "MAC vendor table: this week's IEEE registrations"
          body: |
            `scripts/update-oui.py` found the IEEE registry changed since the table in `assets/oui.txt.gz` was built. This is the rebuilt table and its new date, which Settings shows.

            No version bump: it rides the next release. A pull request opened by a workflow does not start the `build` checks by itself: close and reopen it, or push an empty change, to run them before merging.
          delete-branch: true
