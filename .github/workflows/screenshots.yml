name: screenshots

# Every tab, the Map with a card selected, and Settings, in Dark and Light,
# from the fictional demo map: uploaded as an artifact so a PR's UI changes
# can be looked at without building it.
on:
  pull_request:
    paths: ["src/**", "scripts/demo-map.py", ".github/workflows/screenshots.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tour:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs (tags are mutable).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # A virtual display and software OpenGL to draw into.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libegl1 \
            libxkbcommon-x11-0 libxcb-xkb1 libxcursor1 libxrandr2 libxi6 libx11-xcb1
      - run: cargo build --locked
      - run: python3 scripts/demo-map.py demo.dc.html
      - name: Tour in Dark and Light
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          IS_ALIVE_SHOTS_CLIENTS: some
        run: |
          for theme in dark light; do
            # A settings file of its own, so the theme is the one asked for.
            export XDG_CONFIG_HOME="$RUNNER_TEMP/config-$theme"
            mkdir -p "$XDG_CONFIG_HOME/is-alive"
            printf 'theme=%s\nanimate=0\nglow=0\nsize=1120x720\n' "$theme" \
              > "$XDG_CONFIG_HOME/is-alive/settings"
            IS_ALIVE_SHOTS="shots/$theme" timeout 180 \
              xvfb-run -a -s "-screen 0 1400x900x24" target/debug/is-alive demo.dc.html
            n=$(ls "shots/$theme" | wc -l)
            echo "$theme: $n screenshots"
            # 12 tabs, the Map with a card selected, and Settings.
            test "$n" -eq 14
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: shots/
          retention-days: 14
