name: manual screenshots

# The user manual's pictures (docs/manual/img), made by
# scripts/manual-shots.sh, as an artifact to compare with the committed set.
# Full releases only (x.y.0): the manual's pictures don't change for patches.
# GitHub's runners don't pass ping, so the Ping picture shows timeouts; the
# committed set comes from a local run (see the manual's last chapter).
on:
  push:
    tags: ["v*.*.0"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs (tags are mutable).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Full release?
        id: version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [[ $v =~ ^[0-9]+\.[0-9]+\.0$ ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$v is a patch or pre-release: the manual's pictures are made for full releases (x.y.0) only"
          fi
      - if: steps.version.outputs.full == 'true'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - if: steps.version.outputs.full == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # A virtual display and software OpenGL to draw into.
      - if: steps.version.outputs.full == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libegl1 \
            libxkbcommon-x11-0 libxcb-xkb1 libxcursor1 libxrandr2 libxi6 libx11-xcb1
      - if: steps.version.outputs.full == 'true'
        run: scripts/manual-shots.sh --here --out manual-img
      # Also when the tour failed: its pictures are then in .incoming.
      - if: always() && steps.version.outputs.full == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manual-screenshots
          path: manual-img/
          include-hidden-files: true
          retention-days: 30
