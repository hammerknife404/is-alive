name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # Third-party actions are pinned to commit SHAs (tags are mutable).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      # Authenticode signing, so Windows names the publisher instead of
      # "Unknown publisher". Off until the repository variable SIGNING is
      # "azure" (Azure Artifact Signing; setup in docs/SIGNING.md), and
      # never for pull requests (fork PRs get no secrets). The release job
      # hashes the uploaded artifact, so the .sha256 covers the signed file.
      - name: Code signing configured?
        id: signing
        shell: pwsh
        env:
          SIGNING: ${{ vars.SIGNING }}
          EVENT: ${{ github.event_name }}
          # Only whether each is set; the values stay out of this step.
          HAS_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          HAS_AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT != '' }}
          HAS_AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
          HAS_AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE != '' }}
        run: |
          $sign = 'false'
          if (-not $env:SIGNING) {
            "::notice title=Unsigned::Code signing is not configured (repository variable SIGNING unset), so is-alive.exe is unsigned. See docs/SIGNING.md."
          } elseif ($env:SIGNING -ne 'azure') {
            "::error::Repository variable SIGNING is '$env:SIGNING'; the only supported value is 'azure'."; exit 1
          } elseif ($env:EVENT -eq 'pull_request') {
            "::notice title=Unsigned::Pull request build, so is-alive.exe is not signed."
          } else {
            $missing = 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET',
                       'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_SIGNING_PROFILE' |
              Where-Object { [Environment]::GetEnvironmentVariable("HAS_$_") -ne 'true' }
            if ($missing) { "::error::SIGNING is 'azure' but these are not set: $($missing -join ', '). See docs/SIGNING.md."; exit 1 }
            $sign = 'true'
          }
          "sign=$sign" >> $env:GITHUB_OUTPUT
      - name: Sign is-alive.exe (Azure Artifact Signing)
        if: steps.signing.outputs.sign == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\target\release\is-alive.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: is-alive network tester
          description-url: ${{ github.server_url }}/${{ github.repository }}
      - name: Signature valid
        if: steps.signing.outputs.sign == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature target/release/is-alive.exe
          "Status:    $($sig.Status) $($sig.StatusMessage)"
          "Signer:    $($sig.SignerCertificate.Subject)"
          "Timestamp: $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Error "is-alive.exe signature is $($sig.Status)"; exit 1 }
          if (-not $sig.TimeStamperCertificate) { Write-Error 'is-alive.exe signature has no timestamp'; exit 1 }
      # The .exe must run on a fresh Windows: no Visual C++ Redistributable
      # (VCRUNTIME140.dll) or Universal CRT DLLs to install. The runner has
      # them, so running it here wouldn't notice; the import table would.
      - name: No C runtime DLLs needed
        shell: pwsh
        run: |
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("target/release/is-alive.exe"))
          $bad = 'VCRUNTIME140', 'MSVCP140', 'api-ms-win-crt-' | Where-Object { $text -match [regex]::Escape($_) }
          if ($bad) { Write-Error "is-alive.exe imports: $($bad -join ', ')"; exit 1 }
          "is-alive.exe imports no C runtime DLLs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: is-alive-windows-x64
          path: target/release/is-alive.exe

  linux:
    # Oldest supported runner: the AppImage needs glibc >= the build host's.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Bundled into the AppImage; see build-appimage.sh.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-x11-0 libxcb-xkb1
      - run: packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: is-alive-linux-x86_64
          path: target/appimage/is-alive-x86_64.AppImage

  # Decides whether this run publishes a release, and under which tag:
  # - a pushed v* tag releases that tag (it must match Cargo.toml);
  # - a push to main whose Cargo.toml version has no tag yet releases
  #   v<version>, so merging a version-bump PR is enough to ship.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version ($tag)"
              exit 1
            fi
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
              echo "$tag already exists; not releasing"
            else
              echo "New version $tag on main; releasing"
              release=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: is-alive-windows-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: is-alive-linux-x86_64
      - run: |
          sha256sum is-alive.exe > is-alive.exe.sha256
          sha256sum is-alive-x86_64.AppImage > is-alive-x86_64.AppImage.sha256
      # Creates the tag at this commit if it doesn't exist yet. Notes are
      # generated from the PRs merged since the previous release.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            is-alive.exe
            is-alive.exe.sha256
            is-alive-x86_64.AppImage
            is-alive-x86_64.AppImage.sha256
