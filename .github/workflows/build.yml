name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

# Whether a run releases is decided at its start (is tag v<version> there
# yet?), but the tag is made at its end, ten minutes or more later. Runs
# that could release (pushes to main, tags, by hand) go one at a time, so
# a docs or lockfile merge right after a version bump finds the tag made
# and doesn't publish its own build under it. A newer one waiting replaces
# an older one waiting; one already running is never cancelled. A pull
# request's runs only replace that pull request's.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # Third-party actions are pinned to commit SHAs (tags are mutable).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      # The .exe must run on a fresh Windows: no Visual C++ Redistributable
      # (VCRUNTIME140.dll) or Universal CRT DLLs to install. The runner has
      # them, so running it here wouldn't notice; the import table would.
      - name: No C runtime DLLs needed
        shell: pwsh
        run: |
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("target/release/is-alive.exe"))
          $bad = 'VCRUNTIME140', 'MSVCP140', 'api-ms-win-crt-' | Where-Object { $text -match [regex]::Escape($_) }
          if ($bad) { Write-Error "is-alive.exe imports: $($bad -join ', ')"; exit 1 }
          "is-alive.exe imports no C runtime DLLs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: is-alive-windows-x64
          path: target/release/is-alive.exe

  linux:
    # Oldest supported runner: the AppImage needs glibc >= the build host's.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: python3 skills/mapnetwork/scripts/test_engine_contract.py
      - run: python3 skills/mapnetwork/scripts/test_validate_map.py
      - run: python3 scripts/test_skill_scripts.py
      - run: python3 scripts/test_extract_bson.py
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Bundled into the AppImage; see build-appimage.sh.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-x11-0 libxcb-xkb1
      - run: packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: is-alive-linux-x86_64
          path: target/appimage/is-alive-x86_64.AppImage

  # Decides whether this run publishes a release, and under which tag:
  # - a pushed v* tag releases that tag (it must match Cargo.toml);
  # - a push to main whose Cargo.toml version has no tag yet releases
  #   v<version>, so merging a version-bump PR is enough to ship.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version ($tag)"
              exit 1
            fi
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
              echo "$tag already exists; not releasing"
            else
              echo "New version $tag on main; releasing"
              release=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # Signs is-alive.exe (Authenticode, through Azure Artifact Signing), so
  # Windows names the publisher instead of "Unknown Publisher". Only for a
  # release, and only once signing is set up (docs/wiki/Developing.md, "Code
  # signing"): until AZURE_SIGNING_ACCOUNT is set the release ships the
  # unsigned .exe, as before. Its own job, so the Azure sign-in never shares
  # a runner with cargo and the crates' build scripts; and in the
  # release-signing environment, whose branch rules decide which refs may
  # sign at all (the Azure credential trusts that environment only).
  sign:
    if: needs.version.outputs.release == 'true' && vars.AZURE_SIGNING_ACCOUNT != ''
    needs: [version, windows]
    runs-on: windows-latest
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: is-alive-windows-x64
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\is-alive.exe
          file-digest: SHA256
          # The certificate lasts three days; the timestamp keeps the
          # signature valid after it expires.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: is-alive
          description-url: https://github.com/${{ github.repository }}
          # The signing tools come fresh from their pinned versions, not
          # from a cache another job could have written.
          cache-dependencies: false
          # Sign in only with the azure/login session above.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-azure-cli-credential: false
      - name: The signature checks out
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature is-alive.exe
          if ($sig.Status -ne 'Valid') { Write-Error "is-alive.exe signature: $($sig.Status) ($($sig.StatusMessage))"; exit 1 }
          if (-not $sig.TimeStamperCertificate) { Write-Error "is-alive.exe is signed but not timestamped"; exit 1 }
          "Signed by $($sig.SignerCertificate.Subject)"
          "Timestamped by $($sig.TimeStamperCertificate.Subject)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: is-alive-windows-x64-signed
          path: is-alive.exe

  release:
    # Runs after sign whether it signed or was skipped (signing not set up);
    # a signing failure stops the release rather than ship it unsigned.
    if: >-
      !cancelled()
      && needs.version.outputs.release == 'true'
      && needs.windows.result == 'success'
      && needs.linux.result == 'success'
      && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    needs: [version, windows, linux, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the build attestation: a signed statement, kept by GitHub,
      # that these exact files were built by this workflow from this
      # commit. The checksums beside them only show a clean download.
      id-token: write
      attestations: write
    steps:
      # The signed .exe when sign ran, so the checksum and the attestation
      # below are of the file users download.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign.result == 'success' && 'is-alive-windows-x64-signed' || 'is-alive-windows-x64' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: is-alive-linux-x86_64
      - run: |
          sha256sum is-alive.exe > is-alive.exe.sha256
          sha256sum is-alive-x86_64.AppImage > is-alive-x86_64.AppImage.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            is-alive.exe
            is-alive-x86_64.AppImage
      # Creates the tag at this commit if it doesn't exist yet. Notes are
      # generated from the PRs merged since the previous release.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            is-alive.exe
            is-alive.exe.sha256
            is-alive-x86_64.AppImage
            is-alive-x86_64.AppImage.sha256
